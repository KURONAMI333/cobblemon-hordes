# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.1.0
group=com.kuronami.cobblemonhordes
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Cobblemon Horde Battles
mod_author=KURONAMI
mod_id=cobblemon_hordes
license=MIT
credits=
description=Wild Pokemon can ambush you in groups. Whittle the group down and catch the last one standing.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
# Floors set by Cobblemon itself, not by this mod: cobblemon 1.7.3+1.21.1's
# fabric.mod.json declares `fabricloader >=0.17.2` and `fabric-api >=0.116.6+1.21.1`,
# and the loader refuses to start when either is older ("Incompatible mods found!").
# Cobblemon is a hard dependency here, so its floor is this mod's effective floor.
fabric_version=0.116.11+1.21.1
fabric_loader_version=0.18.2
# Fabric Language Kotlin - dev-runtime only (localRuntime), matches what Cobblemon's
# fabric artifact itself bundles via jar-in-jar (verified inside fabric-1.7.3+1.21.1.jar's
# fabric.mod.json "jars" entry): fabric-language-kotlin-1.13.6+kotlin.2.2.20.jar.
fabric_language_kotlin_version=1.13.6+kotlin.2.2.20

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.227
neoforge_loader_version_range=[4,)

# Cobblemon (third-party addon target; real coordinates verified from
# timinc-cobble/cobblemon-capture-xp v1.7.3/main)
cobblemon_version=1.7.3+1.21.1
# Kotlin language provider Cobblemon's neoforge.mods.toml requires (loaderVersion "[5.3,)").
# 5.10.0 is what Cobblemon itself builds against (gradle/libs.versions.toml).
kotlinforforge_version=5.10.0
# Matches Cobblemon 1.7.x's Kotlin (compile-time only on our side).
kotlin_version=2.2.20

# The Kotlin plugin on :fabric exists only to switch on Loom's Kotlin metadata remapper.
# It must not also add kotlin-stdlib to the dependency graph: the project declares its own
# compileOnly stdlib, and the runtime one comes from fabric-language-kotlin.
kotlin.stdlib.default.dependency=false

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
